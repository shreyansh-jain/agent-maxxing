name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Skills follow docs/SKILL-STANDARD.md
        run: python3 scripts/validate_skills.py --strict
      - name: marketplace.json is generated from skill categories
        run: python3 scripts/build_marketplace.py --check
      - name: THIRD_PARTY_NOTICES.md is generated from skill sources
        run: python3 scripts/build_notices.py --check
      - name: Shell scripts parse
        run: for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done
